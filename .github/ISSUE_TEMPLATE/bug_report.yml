name: Bug report
description: Something did not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Include the command and the exit code."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
  - type: input
    id: version
    attributes: {label: Output of `pulse version`}
