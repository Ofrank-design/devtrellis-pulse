# Example only. Copy to .github/workflows/pulse.yml and adjust.
# GitHub may delay or skip scheduled runs. Pulse never makes up for missed runs.
name: Pulse maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1,3,5"

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install devtrellis-pulse
      - run: pulse run --scheduled --execute
      - uses: actions/upload-artifact@v7
        with:
          name: pulse-reports
          path: reports/pulse/
